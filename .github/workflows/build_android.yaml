name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'Android/**'
      - 'docs/termux-execution-architecture.md'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Android/**'
      - 'docs/termux-execution-architecture.md'

jobs:
  build_apk:
    name: Test and build Android APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Android/src
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Android SDK Platform 37
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0"
      - name: Run Shizuku debug unit tests
        run: ./gradlew :app:testShizukuDebugUnitTest
      - name: Build Shizuku debug APK
        run: ./gradlew :app:assembleShizukuDebug
      - name: Build release APK
        run: ./gradlew :app:assembleRelease
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-mcp-apks
          path: |
            Android/src/app/build/outputs/apk/shizuku/debug/*.apk
            Android/src/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
